<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login / Signup - TrekHub SummitAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;900&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2" />
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark th-nav sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="fw-bold">TrekHub<span class="text-warning">SummitAI</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html#explore">Explore</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#recommend">Recommend</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#nlp">Ask AI</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#add">Add Trek</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5" id="loginSection">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <h2 class="card-title text-center mb-4">Login</h2>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                            <hr class="my-4">
                            <p class="text-center">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5 d-none" id="signupSection">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <h2 class="card-title text-center mb-4">Sign Up</h2>
                            <form id="signupForm">
                                <div class="mb-3">
                                    <label for="signupName" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="signupName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="signupEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="signupEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="signupPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="signupPassword" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Sign Up</button>
                            </form>
                            <hr class="my-4">
                            <p class="text-center">Already have an account? <a href="#" id="showLogin">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        const API_BASE = "http://localhost:8001/api";

        // Toggle between login and signup forms
        document.getElementById('showSignup').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('signupSection').classList.remove('d-none');
        });

        document.getElementById('showLogin').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('signupSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
        });

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const button = this.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'Logging in...';

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert('Login successful!');
                    window.location.href = 'index.html';
                } else {
                    alert('Error: ' + (data.error || 'Login failed'));
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            } finally {
                button.disabled = false;
                button.textContent = 'Login';
            }
        });

        // Handle signup form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const button = this.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'Creating account...';

            try {
                const response = await fetch(`${API_BASE}/signup`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, email, password})
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Account created! Please login.');
                    document.getElementById('signupForm').reset();
                    document.getElementById('signupSection').classList.add('d-none');
                    document.getElementById('loginSection').classList.remove('d-none');
                    document.getElementById('loginEmail').value = email;
                } else {
                    alert('Error: ' + (data.error || 'Signup failed'));
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            } finally {
                button.disabled = false;
                button.textContent = 'Sign Up';
            }
        });
    </script>
</body>

</html>
